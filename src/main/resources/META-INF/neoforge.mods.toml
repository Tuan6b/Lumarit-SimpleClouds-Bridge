modLoader = "javafml"
loaderVersion = "[4,)"
license = "Apache-2.0"

[[mods]]
modId = "lumarit_scbridge"
version = "${version}"
displayName = "Lumarit Simple Clouds Bridge"
authors = "Tuan6b"
description = "Lets an Iris shader pack draw Simple Clouds' clouds: while a pack is in use, Simple Clouds' own cloud drawing is switched off and its cloud regions and real 3D cloud shapes are handed to the pack, while its weather, rain and lightning keep running. Needs a pack that supports it, such as Lumarit 1.3-beta2 or later."

[[mixins]]
config = "lumarit_scbridge.mixins.json"

[[dependencies.lumarit_scbridge]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.lumarit_scbridge]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.lumarit_scbridge]]
modId = "simpleclouds"
type = "required"
versionRange = "[0.7,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.lumarit_scbridge]]
modId = "iris"
type = "required"
versionRange = "[1.8,)"
ordering = "NONE"
side = "CLIENT"
